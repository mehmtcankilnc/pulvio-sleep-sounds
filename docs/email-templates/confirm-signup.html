<!--
  Supabase Dashboard → Authentication → Email Templates → "Confirm signup"
  Paste this into the "Message body" field (HTML mode).

  NOTE — single-locale limitation: Supabase's dashboard templates are ONE
  template for ALL users, regardless of their app language. This one is
  written in English as the safest universal default. True per-recipient
  localization (Turkish for a Turkish user, etc.) requires switching to a
  custom "Send Email" Auth Hook that sends via Resend (already wired into
  this project for other transactional email) instead of Supabase's built-in
  mailer — a separate, larger change. Ask if you want that built.

  Variables Supabase substitutes here: {{ .ConfirmationURL }}
-->
<div style="background-color:#f2ede9;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background-color:#ffffff;border-radius:20px;overflow:hidden;border:1px solid #ece1da;">
    <tr>
      <td style="padding:36px 32px 8px 32px;text-align:center;">
        <span style="font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:22px;color:#d97e52;">Pulvio</span>
      </td>
    </tr>
    <tr>
      <td style="padding:8px 32px 0 32px;text-align:center;">
        <h1 style="margin:0;font-size:20px;line-height:28px;color:#2b1f1a;font-weight:700;">Confirm your email</h1>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 32px 0 32px;text-align:center;">
        <p style="margin:0;font-size:14.5px;line-height:22px;color:#6b5c55;">
          Tap the button below to confirm your address and finish setting up your account. This link is valid for a limited time.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:28px 32px 8px 32px;text-align:center;">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;background-color:#d97e52;color:#2b130a;font-weight:700;font-size:15px;text-decoration:none;padding:14px 32px;border-radius:999px;">
          Confirm email
        </a>
      </td>
    </tr>
    <tr>
      <td style="padding:20px 32px 0 32px;text-align:center;">
        <p style="margin:0;font-size:12.5px;line-height:18px;color:#a89a92;">
          If you didn't create a Pulvio account, you can safely ignore this email.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:28px 32px 32px 32px;text-align:center;">
        <p style="margin:0;font-size:11.5px;color:#c2b6ae;">Pulvio · Calm sounds for sleep</p>
      </td>
    </tr>
  </table>
</div>
