steps:
  - echo: >-
      FRESH INSTALL ONLY — must run before any sign-in on this app instance
      (first launch after `simctl install`, before wk-02 ever runs). Walks the
      full onboarding funnel (welcome -> frequency -> struggles -> sounds ->
      bedtime -> reminder -> plan-ready -> preview) and the natural hand-off
      into the paywall (from=onboarding). en-US locale strings used as
      selectors (no testIDs exist on these screens beyond welcome's
      onboarding-have-account). Store-build sets
      EXPO_PUBLIC_DISABLE_PUSH_PROMPT=1, so the reminder step's "Yes, nudge
      me" does not raise an OS permission dialog. RevenueCat is not wired on
      iOS yet (Platform.OS !== "android" early-return in
      src/lib/revenuecat.ts), so the paywall shows its "couldn't load" empty
      state rather than priced offer cards — expected, not a capture bug.
      Tapping "Close" there is a real product path (see paywall.tsx dismiss()):
      it establishes an anonymous guest session and lands on Explore — wk-02
      picks up from there to show the "Complete your account" / sign-in path.
      IMPORTANT: app/(onboarding)/_layout.tsx switches its Stack screen
      transition to a plain native "fade" whenever useReducedMotion() reads
      true (vs. the normal slide_from_right) — the iOS simulator can default
      to Reduce Motion on, so a `visible` match can land while that fade is
      still mid-flight and the next control isn't interactive yet. Every
      screen-arrival `await: visible` below is followed by `await: idle`
      before the first tap on that screen, specifically to clear this.
      The preview screen's eyebrow text ("Playing now" vs "Ready for
      tonight") depends on whether recommendPlan() found any picks for this
      combination of answers — not guaranteed — so the identity check after
      "Hear it" uses the footnote text instead, which renders either way.
  - launch: com.pulvio.app
  - await: { visible: { text: "Fall asleep, the easy way" }, timeout: 30000 }
  - await: { idle: true }
  - tap: { text: "Get started" }

  - await: { visible: { text: "How often is falling asleep hard?" }, timeout: 15000 }
  - await: { idle: true }
  - tap: { text: "Most nights" }
  - await: { idle: true }
  - tap: { text: "Continue" }

  - await: { visible: { text: "What keeps you up at night?" }, timeout: 15000 }
  - await: { idle: true }
  - tap: { text: "Racing thoughts" }
  - tap: { text: "Stress and tension" }
  - await: { idle: true }
  - tap: { text: "Continue" }

  - await: { visible: { text: "What helps you drift off?" }, timeout: 15000 }
  - await: { idle: true }
  - tap: { text: "Rain and Thunder" }
  - tap: { text: "White Noise" }
  - await: { idle: true }
  - tap: { text: "Continue" }

  # Mounting react-native-date-picker's native wheel here is heavier than the
  # prior screens' plain Views — under a screen recording (extra CPU/GPU load
  # on the simulator) a 15s budget has been seen to time out even though the
  # same await passes comfortably unrecorded (see 07-paywall-yearly). 30s
  # matches the plan-ready catalog-fetch await below for the same reason.
  - await: { visible: { text: "When do you usually go to bed?" }, timeout: 30000 }
  - await: { idle: true }
  - wait: 800
  - tap: { text: "Continue" }

  - await: { visible: { text: "Want a bedtime nudge?" }, timeout: 15000 }
  - await: { idle: true }
  - tap: { text: "Yes, nudge me" }
  - await: { idle: true }
  - tap: { text: "Continue" }

  - await: { visible: { text: "Your wind-down is ready" }, timeout: 20000 }
  - await: { idle: true }
  # "Hear it" is in the tree (and tappable-looking) even while the catalog
  # fetch behind it is still loading — plan-ready.tsx only gates it with
  # `disabled={loading || !!error}`, and `idle` settling with a warning here
  # (small ongoing change = the loading spinner) is not proof loading
  # finished. A disabled RN Pressable still accepts the tap dispatch and
  # silently drops the press, so a premature tap here strands the flow on
  # this screen with no error — that's what happened before this wait.
  - wait: 3000
  - tap: { text: "Hear it" }

  - await: { visible: { text: "Next, create an account" }, timeout: 15000 }
  - wait: 5000
  - tap: { text: "Continue" }

  - await: { visible: { text: "Pulvio Premium" }, timeout: 15000 }
  - await: { idle: true }
  - tap: { text: "Close" }

  - await: { visible: { id: explore-screen }, timeout: 20000 }
  - await: { idle: true }
